<section class="card">
  <p class="eyebrow">Premier accord</p>
  <h1>Créer un compte</h1>
  <p class="lede">Quelques secondes suffisent pour commencer à importer vos pistes.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="register-name">
      Nom
      <input id="register-name" formControlName="name" autocomplete="name" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="field-error">Nom requis</span>
      }
    </label>

    <label for="register-email">
      Email
      <input id="register-email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        @if (form.controls.email.errors?.['required']) {
          <span class="field-error">Email requis</span>
        } @else if (form.controls.email.errors?.['email']) {
          <span class="field-error">Format d'email invalide</span>
        }
      }
    </label>

    <label for="register-password">
      Mot de passe
      <input
        id="register-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        @if (form.controls.password.errors?.['required']) {
          <span class="field-error">Mot de passe requis</span>
        } @else if (form.controls.password.errors?.['minlength']) {
          <span class="field-error">8 caractères minimum</span>
        }
      } @else {
        <span class="hint">8 caractères minimum.</span>
      }
    </label>

    <button type="submit">Créer mon compte</button>
  </form>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <p class="switch">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
</section>
