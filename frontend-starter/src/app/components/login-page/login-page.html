<section class="card">
  <p class="eyebrow">Bon retour</p>
  <h1>Connexion</h1>
  <p class="lede">Retrouvez votre bibliothèque de backing tracks.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="login-email">
      Email
      <input id="login-email" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        @if (form.controls.email.errors?.['required']) {
          <span class="field-error">Email requis</span>
        } @else if (form.controls.email.errors?.['email']) {
          <span class="field-error">Format d'email invalide</span>
        }
      }
    </label>

    <label for="login-password">
      Mot de passe
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Mot de passe requis</span>
      }
    </label>

    <button type="submit">Se connecter</button>
  </form>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <p class="switch">Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
</section>
